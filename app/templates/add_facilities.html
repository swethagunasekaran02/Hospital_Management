{% include 'header.html' %}

    <div class="card form-tag" style="width: 50%;margin:30px auto 0;">
      <div class="card-header">Add Hospital Facilities </div>
      <div class="card-body">
        {% if messages %}
          {% for i in messages %}
            <div class="alert alert-success">{{i}}</div>
          {% endfor %}
        {% endif %}
        <form method="post" enctype="multipart/form-data"> {% csrf_token %}
          <div class="form-group">
            <div class="form-row">
             
              <div class="col-md-12">
                <div class="">
				 <label>Doctor Details</label><br>
				<textarea name="doctor_detail" class="form-control"  required="required"></textarea>
                </div>
              </div>
            </div>
          </div>
		  <div class="form-group">
            <div class="form-row">
             
              <div class="col-md-12">
                <div class="">
				 <label>Bed Availabilites</label><br>
				<input type="number" name="bed_detail" class="form-control"  required="required">
                </div>
              </div>
            </div>
          </div>
		  	  <div class="form-group">
            <div class="form-row">
             
              <div class="col-md-12">
                <div class="">
				 <label>No of Oxygen Cylinder</label><br>
				<input type="number" name="cylinder_count" class="form-control"  required="required">
                </div>
              </div>
            </div>
          </div>
          <div class="form-group">
            <div class="form-row">
             
              <div class="col-md-12">
                <div class="">
				 <label>Blood Bank Details</label><br>
				<textarea name="blood_bank" class="form-control"  required="required"></textarea>
                </div>
              </div>
            </div>
          </div>
         <div class="form-group">
            <div class="form-row">
             
              <div class="col-md-12">
                <div class="">
				 <label>Medical Equipment Details</label><br>
				<textarea name="medical_detail" class="form-control"  required="required"></textarea>
                </div>
              </div>
            </div>
          </div>
		   <div class="form-group">
            <div class="form-row">
             
              <div class="col-md-12">
                <div class="">
				 <label>Ambulance Details</label><br>
				<textarea name="ambulance" class="form-control"  required="required"></textarea>
                </div>
              </div>
            </div>
          </div>
		   <div class="form-group">
            <div class="form-row">
             
              <div class="col-md-12">
                <div class="">
				 <label>Other Facilities</label><br>
				<textarea name="other" class="form-control"  required="required"></textarea>
                </div>
              </div>
            </div>
          </div>
		  
          <input type="submit" class="btn btn-primary btn-block" value="Add Details">
          
        </form>
      </div>
    </div>

{% include 'footer.html' %}
